name: RouteQuest
options:
  bundleIdPrefix: com.aepikgamer
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
targets:
  RouteQuest:
    type: application
    platform: iOS
    sources:
      - path: RouteQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aepikgamer.routequest
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
